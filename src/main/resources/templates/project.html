<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git合流管理系统</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-256x256.png">
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon-128x128.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <!-- Element UI CSS with Fallback -->
    <link rel="stylesheet" href="https://unpkg.com/element-ui@2.15.14/lib/theme-chalk/index.css" 
          onerror="this.onerror=null;this.href='/lib/element-ui/index.css';">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        #app {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
        }

        [v-cloak] {
            display: none !important;
        }

        .page-loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-content {
            text-align: center;
            color: #409eff;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #409eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .header {
            background-color: #545c64;
            color: #fff;
            line-height: 60px;
            padding: 0 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            display: flex;
            height: calc(100vh - 60px);
        }

        .sidebar {
            width: 200px;
            background-color: #324157;
        }

        .main-content {
            flex: 1;
            padding: 10px;
            background-color: #f5f5f5;
        }

        .content-card {
            background: white;
            border-radius: 4px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .12), 0 0 6px rgba(0, 0, 0, .04);
        }

        .search-form {
            padding: 20px;
            border-bottom: 1px solid #e6e6e6;
        }

        .table-container {
            padding: 20px;
        }

        .page-title {
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #303133;
        }

        .el-table .cell {
            line-height: 1.5;
        }

        .link-button {
            margin-right: 10px;
            color: #409eff;
            cursor: pointer;
            text-decoration: none;
        }

        .link-button:hover {
            color: #66b1ff;
        }

        /* 全局加载模态框 */
        .global-loading-mask {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .global-loading-content {
            background: #fff;
            padding: 30px 50px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }
        .global-loading-content i {
            font-size: 36px;
            color: #409eff;
        }
        .global-loading-content span {
            font-size: 16px;
            color: #606266;
        }

        /* 用户下拉菜单样式 */
        .user-dropdown {
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
        }
        .user-dropdown:hover {
            color: #409eff;
        }
        .user-dropdown i {
            font-size: 12px;
        }
    </style>
</head>
<body>
<!-- 初始加载页面 -->
<div id="page-loading" class="page-loading">
    <div class="loading-content">
        <div class="loading-spinner"></div>
        <div>正在加载页面...</div>
    </div>
</div>

<div id="app" v-cloak>
    <!-- 头部 -->
    <div class="header">
        <span>Git合流管理系统</span>
        <div class="header-right" style="float: right; display: flex; align-items: center;">
            <el-dropdown @command="handleUserCommand" trigger="click">
                <span class="user-dropdown">
                    {{currentUser.nickname || currentUser.username}}
                    <i class="el-icon-arrow-down"></i>
                </span>
                <el-dropdown-menu slot="dropdown">
                    <el-dropdown-item command="changePassword">修改密码</el-dropdown-item>
                    <el-dropdown-item command="logout" divided>退出登录</el-dropdown-item>
                </el-dropdown-menu>
            </el-dropdown>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <el-menu
                    default-active="1"
                    class="el-menu-vertical"
                    background-color="#324157"
                    text-color="#bfcbd9"
                    active-text-color="#409EFF"
                    @select="handleMenuSelect">
                <el-menu-item index="1">
                    <i class="el-icon-files"></i>
                    <span slot="title">Git工程管理</span>
                </el-menu-item>
                <el-menu-item index="2" v-if="currentUser.isAdmin">
                    <i class="el-icon-office-building"></i>
                    <span slot="title">Git组织管理</span>
                </el-menu-item>
                <el-menu-item index="3" v-if="currentUser.isAdmin">
                    <i class="el-icon-user"></i>
                    <span slot="title">用户管理</span>
                </el-menu-item>
            </el-menu>
        </div>

        <!-- 主内容区 -->
        <div class="main-content">
            <div class="page-title">Git工程管理</div>

            <div class="content-card">
                <!-- 搜索表单 -->
                <div class="search-form">
                    <div class="demo-form-inline" style="display: flex; align-items: center; gap: 10px;">
                        <div style="display: flex; align-items: center; gap: 5px;">
                            <label>工程名称</label>
                            <el-input v-model="searchForm.gitProjectName" placeholder="请输入工程名称"
                                      clearable
                                      @keyup.enter.native="handleEnterKey"
                                      style="width: 200px;"></el-input>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <el-button type="primary" @click="handleSearch" :loading="searchLoading">搜索</el-button>
                            <el-button @click="handleReset">重置</el-button>
                            <el-button type="success" @click="handleAddProject" v-if="currentUser.isAdmin">添加Git工程</el-button>
                        </div>
                    </div>
                </div>

                <!-- 表格 -->
                <div class="table-container">
                    <el-table
                            :data="tableData"
                            v-loading="loading"
                            style="width: 100%"
                            element-loading-text="正在加载中..."
                            element-loading-spinner="el-icon-loading">
                        <el-table-column prop="projectName" label="工程名称" width="150"></el-table-column>
                        <el-table-column label="操作" min-width="400">
                            <template slot-scope="scope">
                                <a class="link-button" @click="handleBranchManage(scope.row)">分支管理</a>
                                <a class="link-button" @click="handleMixBranch(scope.row, 'dev')">dev中间分支</a>
                                <a class="link-button" @click="handleMixBranch(scope.row, 'test')">test中间分支</a>
                                <a class="link-button" @click="handleMixBranch(scope.row, 'pre')">pre中间分支</a>
                            </template>
                        </el-table-column>
                    </el-table>

                    <!-- 分页 -->
                    <el-pagination
                            @size-change="handleSizeChange"
                            @current-change="handleCurrentChange"
                            :current-page="pagination.current"
                            :page-sizes="[10, 20, 50, 100]"
                            :page-size="pagination.size"
                            layout="total, sizes, prev, pager, next, jumper"
                            :total="pagination.total"
                            style="margin-top: 20px; text-align: right;">
                    </el-pagination>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加工程弹窗 -->
    <el-dialog title="添加Git工程" :visible.sync="addProjectVisible" width="500px" :close-on-click-modal="false">
        <el-form :model="addProjectForm" :rules="addProjectRules" ref="addProjectForm" label-width="100px">
            <el-form-item label="Git组织" prop="organizationId">
                <el-select v-model="addProjectForm.organizationId" placeholder="请选择Git组织" style="width: 100%"
                           @change="handleOrganizationChange">
                    <el-option
                            v-for="org in organizationList"
                            :key="org.organizationId"
                            :label="org.organizationName"
                            :value="org.organizationId">
                    </el-option>
                </el-select>
            </el-form-item>
            <el-form-item label="仓库名称" prop="repositoryId">
                <el-select v-model="addProjectForm.repositoryId"
                           filterable
                           remote
                           clearable
                           :remote-method="filterRepositories"
                           @clear="handleClearRepository"
                           placeholder="请输入仓库名称进行搜索"
                           style="width: 100%"
                           :disabled="!addProjectForm.organizationId"
                           :loading="repositoryLoading">
                    <el-option
                            v-for="repo in filteredRepositoryList"
                            :key="repo.repositoryId"
                            :label="repo.repositoryName"
                            :value="repo.repositoryId">
                    </el-option>
                </el-select>
            </el-form-item>
            <el-form-item label="工程名称" prop="projectName">
                <el-input v-model="addProjectForm.projectName" placeholder="请输入工程名称"></el-input>
            </el-form-item>
        </el-form>
        <div slot="footer" class="dialog-footer">
            <el-button @click="addProjectVisible = false">取消</el-button>
            <el-button type="primary" @click="handleSaveProject" :loading="saveProjectLoading">保存</el-button>
        </div>
    </el-dialog>

    <!-- 操作人登录弹窗 - 已废弃，保留兼容 -->
    <el-dialog title="操作人登录" :visible.sync="operatorLoginVisible" width="400px" :close-on-click-modal="false"
               :close-on-press-escape="false" v-if="false">
        <div style="padding: 20px;">
            <div style="display: flex; align-items: center; margin-bottom: 20px;">
                <label style="width: 80px; text-align: right; margin-right: 10px;">操作人：</label>
                <el-input v-model="operatorForm.operator" placeholder="请输入操作人"
                          @keyup.enter.native="handleEnterKeySave" style="flex: 1;"></el-input>
            </div>
        </div>
        <div slot="footer" class="dialog-footer">
            <el-button @click="handleCloseOperatorDialog">关闭</el-button>
            <el-button type="primary" @click="handleSaveOperator">保存</el-button>
        </div>
    </el-dialog>

    <!-- 修改密码弹窗 -->
    <el-dialog title="修改密码" :visible.sync="changePwdDialogVisible" width="400px" :close-on-click-modal="false">
        <el-form :model="changePwdForm" :rules="changePwdRules" ref="changePwdForm" label-width="80px">
            <el-form-item label="旧密码" prop="oldPassword">
                <el-input v-model="changePwdForm.oldPassword" type="password" placeholder="请输入旧密码" show-password></el-input>
            </el-form-item>
            <el-form-item label="新密码" prop="newPassword">
                <el-input v-model="changePwdForm.newPassword" type="password" placeholder="请输入新密码" show-password></el-input>
            </el-form-item>
        </el-form>
        <div slot="footer">
            <el-button @click="changePwdDialogVisible = false">取消</el-button>
            <el-button type="primary" @click="handleConfirmChangePassword" :loading="changePwdLoading">确定</el-button>
        </div>
    </el-dialog>

    <!-- 全局加载模态框 -->
    <div v-if="globalLoading" class="global-loading-mask">
        <div class="global-loading-content">
            <i class="el-icon-loading"></i>
            <span>{{globalLoadingText}}</span>
        </div>
    </div>
</div>

<!-- Vue.js with Fallback -->
<script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.min.js"></script>
<script>window.Vue || document.write('<script src="/lib/vue/vue.min.js"><\/script>')</script>

<!-- Element UI with Fallback -->
<script src="https://unpkg.com/element-ui@2.15.14/lib/index.js"></script>
<script>window.ELEMENT || document.write('<script src="/lib/element-ui/index.js"><\/script>')</script>

<!-- Axios with Fallback -->
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
<script>window.axios || document.write('<script src="/lib/axios/axios.min.js"><\/script>')</script>

<script src="/js/common.js"></script>

<script>
    new Vue({
        el: '#app',
        data() {
            return {
                loading: false,
                searchLoading: false,
                saveProjectLoading: false,
                dataInitialized: false,
                searchForm: {
                    gitProjectName: ''
                },
                tableData: [],
                pagination: {
                    current: 1,
                    size: 10,
                    total: 0
                },
                addProjectVisible: false,
                addProjectForm: {
                    organizationId: '',
                    repositoryId: '',
                    projectName: ''
                },
                addProjectRules: {
                    organizationId: [
                        {required: true, message: '请选择Git组织', trigger: 'change'}
                    ],
                    repositoryId: [
                        {required: true, message: '请选择仓库名称', trigger: 'change'}
                    ],
                    projectName: [
                        {required: true, message: '请输入工程名称', trigger: 'blur'}
                    ]
                },
                organizationList: [],
                repositoryList: [],
                filteredRepositoryList: [],
                repositoryLoading: false,
                // 操作人相关 (兼容)
                operatorLoginVisible: false,
                operatorForm: {
                    operator: ''
                },
                operatorButtonText: '登录',
                // 全局加载状态
                globalLoading: false,
                globalLoadingText: '处理中...',
                // 当前用户
                currentUser: {
                    username: '',
                    nickname: '',
                    isAdmin: false
                },
                // 修改密码
                changePwdDialogVisible: false,
                changePwdLoading: false,
                changePwdForm: { oldPassword: '', newPassword: '' },
                changePwdRules: {
                    oldPassword: [{ required: true, message: '请输入旧密码', trigger: 'blur' }],
                    newPassword: [{ required: true, message: '请输入新密码', trigger: 'blur' }]
                }
            }
        },
        mounted() {
            // 检查登录状态
            const token = localStorage.getItem('satoken');
            if (!token) {
                window.location.href = '/login';
                return;
            }

            // 隐藏初始loading页面
            const pageLoading = document.getElementById('page-loading');
            if (pageLoading) {
                pageLoading.style.display = 'none';
            }

            // 确保searchForm初始化
            this.$nextTick(() => {
                this.$set(this, 'searchForm', {
                    gitProjectName: ''
                });
            });

            this.initCurrentUser();
            this.loadData();
            this.addGlobalEnterKeyHandler();
        },
        methods: {
            // 初始化当前用户
            initCurrentUser() {
                this.currentUser = {
                    username: localStorage.getItem('username') || '',
                    nickname: localStorage.getItem('nickname') || localStorage.getItem('operator') || '',
                    isAdmin: localStorage.getItem('isAdmin') === 'true'
                };
            },

            // 用户菜单命令
            handleUserCommand(command) {
                if (command === 'changePassword') {
                    this.changePwdForm = { oldPassword: '', newPassword: '' };
                    this.changePwdDialogVisible = true;
                } else if (command === 'logout') {
                    this.handleLogout();
                }
            },

            // 退出登录
            handleLogout() {
                axios.post('/auth/logout').finally(() => {
                    localStorage.clear();
                    window.location.href = '/login';
                });
            },

            // 确认修改密码
            handleConfirmChangePassword() {
                this.$refs.changePwdForm.validate((valid) => {
                    if (valid) {
                        this.changePwdLoading = true;
                        axios.post('/api/v1/user/updateMyPassword', this.changePwdForm)
                            .then(response => {
                                if (response.data.code === 200) {
                                    this.$message.success('密码修改成功，请重新登录');
                                    this.changePwdDialogVisible = false;
                                    setTimeout(() => { this.handleLogout(); }, 1000);
                                } else {
                                    this.$message.error(response.data.message || '修改失败');
                                }
                            })
                            .catch(error => { this.$message.error('网络请求失败'); console.error(error); })
                            .finally(() => { this.changePwdLoading = false; });
                    }
                });
            },

            // 加载数据
            loadData() {
                this.loading = true;
                const params = {
                    currentPage: this.pagination.current,
                    pageSize: this.pagination.size,
                    param: {
                        gitProjectName: this.searchForm.gitProjectName || null
                    }
                };

                axios.post('/api/v1/git-merge-flow/pageGitProject', params)
                    .then(response => {
                        if (response?.data?.code === 200) {
                            this.tableData = response.data.data.records;
                            this.pagination.total = response.data.data.total;
                        } else {
                            this.$message.error(response.data.message || '查询失败');
                        }
                    })
                    .catch(error => {
                        this.$message.error('网络请求失败');
                        console.error(error);
                    })
                    .finally(() => {
                        this.loading = false;
                        this.searchLoading = false;
                        this.dataInitialized = true;
                    });
            },

            // 回车键事件处理
            handleEnterKey() {
                this.handleSearch();
            },

            // 搜索
            handleSearch(event) {
                if (event) {
                    event.preventDefault();
                    event.stopPropagation();
                }

                this.searchLoading = true;
                this.pagination.current = 1;
                this.loadData();
            },

            // 重置
            handleReset() {
                this.searchForm.gitProjectName = '';
                this.pagination.current = 1;
                this.loadData();
            },

            // 分页大小改变
            handleSizeChange(val) {
                this.pagination.size = val;
                this.pagination.current = 1;
                this.loadData();
            },

            // 当前页改变
            handleCurrentChange(val) {
                this.pagination.current = val;
                this.loadData();
            },

            // 菜单选择
            handleMenuSelect(key) {
                if (key === '1') {
                    window.location.href = '/project';
                } else if (key === '2') {
                    window.location.href = '/organization';
                } else if (key === '3') {
                    window.location.href = '/user';
                }
            },

            // 分支管理
            handleBranchManage(row) {
                window.location.href = `/branch?projectId=${row.projectId}&projectName=${row.projectName}`;
            },

            // 中间分支管理
            handleMixBranch(row, env) {
                let mixBranchId = '';
                if (env === 'dev') {
                    mixBranchId = row.devMixBranchId;
                } else if (env === 'test') {
                    mixBranchId = row.testMixBranchId;
                } else if (env === 'pre') {
                    mixBranchId = row.preMixBranchId;
                }

                if (mixBranchId) {
                    window.location.href = `/mix-branch/detail?mixBranchId=${mixBranchId}&projectId=${row.projectId}&projectName=${row.projectName}&env=${env}`;
                } else {
                    this.$message.warning(`${env}环境中间分支不存在`);
                }
            },

            // 添加工程
            handleAddProject() {
                this.loadOrganizations();
                this.addProjectVisible = true;
            },

            // 加载组织列表
            loadOrganizations() {
                axios.post('/api/v1/git-merge-flow/listGitOrganization')
                    .then(response => {
                        if (response?.data?.code === 200) {
                            this.organizationList = response.data.data;

                            // 如果只有一条记录，自动选中
                            if (this.organizationList && this.organizationList.length === 1) {
                                this.addProjectForm.organizationId = this.organizationList[0].organizationId;
                                // 自动加载该组织的仓库列表
                                this.handleOrganizationChange(this.organizationList[0].organizationId);
                            }
                        } else {
                            this.$message.error('获取组织列表失败');
                        }
                    })
                    .catch(error => {
                        this.$message.error('网络请求失败');
                        console.error(error);
                    });
            },

            // 组织变更处理
            handleOrganizationChange(organizationId) {
                // 清空仓库选择
                this.addProjectForm.repositoryId = '';
                this.repositoryList = [];
                this.filteredRepositoryList = [];

                if (organizationId) {
                    this.loadRepositories(organizationId);
                }
            },

            // 加载仓库列表
            loadRepositories(organizationId) {
                this.repositoryLoading = true;
                const params = {
                    organizationId: organizationId
                };

                axios.post('/api/v1/git-merge-flow/listGitRepositoryNameByOpenApi', params)
                    .then(response => {
                        if (response?.data?.code === 200) {
                            this.repositoryList = response.data.data;
                            // 初始化过滤后的列表
                            this.filteredRepositoryList = [...this.repositoryList];
                        } else {
                            this.$message.error('获取仓库列表失败');
                        }
                    })
                    .catch(error => {
                        this.$message.error('网络请求失败');
                        console.error(error);
                    })
                    .finally(() => {
                        this.repositoryLoading = false;
                    });
            },

            // 过滤仓库列表（支持模糊查询）
            filterRepositories(query) {
                if (!query || query === '') {
                    this.filteredRepositoryList = [...this.repositoryList];
                } else {
                    this.filteredRepositoryList = this.repositoryList.filter(repo =>
                        repo.repositoryName.toLowerCase().includes(query.toLowerCase())
                    );
                }
            },

            // 处理仓库名称清空事件
            handleClearRepository() {
                // 清空时显示所有仓库选项
                this.filteredRepositoryList = [...this.repositoryList];
            },

            // 保存工程
            handleSaveProject() {
                this.$refs.addProjectForm.validate((valid) => {
                    if (valid) {
                        const operator = localStorage.getItem('operator');
                        if (!operator) {
                            this.$message.error('请先登录设置操作人');
                            return;
                        }

                        if (this.globalLoading) return;
                        this.globalLoading = true;
                        this.globalLoadingText = '正在添加工程...';
                        this.saveProjectLoading = true;

                        const params = {
                            organizationId: this.addProjectForm.organizationId,
                            repositoryId: this.addProjectForm.repositoryId,
                            projectName: this.addProjectForm.projectName,
                            operator: operator
                        };

                        axios.post('/api/v1/git-merge-flow/addGitProject', params)
                            .then(response => {
                                if (response?.data?.code === 200) {
                                    this.$message.success('添加成功');
                                    this.addProjectVisible = false;
                                    this.addProjectForm = {
                                        organizationId: '',
                                        repositoryId: '',
                                        projectName: ''
                                    };
                                    this.repositoryList = [];
                                    this.filteredRepositoryList = [];
                                    this.loadData();
                                } else {
                                    this.$message.error(response.data.message || '添加失败');
                                }
                            })
                            .catch(error => {
                                this.$message.error('网络请求失败');
                                console.error(error);
                            })
                            .finally(() => {
                                this.saveProjectLoading = false;
                                this.globalLoading = false;
                            });
                    }
                });
            },

            // 初始化操作人
            initOperator() {
                const operator = localStorage.getItem('operator');
                if (operator) {
                    this.operatorButtonText = operator;
                } else {
                    this.operatorButtonText = '登录';
                }
            },

            // 操作人登录
            handleOperatorLogin() {
                const operator = localStorage.getItem('operator');
                this.operatorForm.operator = operator || '';
                this.operatorLoginVisible = true;
            },

            // 回车键保存操作人
            handleEnterKeySave(event) {
                // 彻底阻止所有默认行为
                if (event) {
                    event.preventDefault();
                    event.stopPropagation();
                    event.stopImmediatePropagation();

                    // 阻止表单提交
                    if (event.target && event.target.form) {
                        event.target.form.onsubmit = function () {
                            return false;
                        };
                    }
                }

                // 延迟执行保存，确保事件完全处理完毕
                this.$nextTick(() => {
                    this.handleSaveOperator();
                });
            },

            // 关闭操作人对话框
            handleCloseOperatorDialog() {
                this.operatorLoginVisible = false;
            },

            // 保存操作人
            handleSaveOperator() {
                // 手动验证操作人输入
                if (!this.operatorForm.operator || this.operatorForm.operator.trim() === '') {
                    this.$message.error('请输入操作人');
                    return;
                }

                // 保存到localStorage
                localStorage.setItem('operator', this.operatorForm.operator.trim());
                this.operatorButtonText = this.operatorForm.operator.trim();
                this.operatorLoginVisible = false;
                this.$message.success('操作人设置成功');
            },

            // 添加全局回车键事件处理
            addGlobalEnterKeyHandler() {
                document.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') {
                        // 检查当前焦点是否在允许回车键的输入框上
                        const activeElement = document.activeElement;
                        const isProjectNameInput = activeElement &&
                            activeElement.getAttribute('placeholder') === '请输入工程名称';
                        const isOperatorInput = activeElement &&
                            activeElement.getAttribute('placeholder') === '请输入操作人';
                        const isRepositorySearchInput = activeElement &&
                            activeElement.getAttribute('placeholder') === '请输入仓库名称进行搜索';

                        // 如果不在允许的输入框上，阻止回车键事件
                        if (!isProjectNameInput && !isOperatorInput && !isRepositorySearchInput) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                    }
                });
            }
        }
    });
</script>
</body>
</html>
