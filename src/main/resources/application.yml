server:
  port: 18081
  servlet:
    context-path: /

spring:
  application:
    name: git-merge-flow
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.111.11:3306/git_merge_flow?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  
  thymeleaf:
    mode: HTML
    encoding: UTF-8
    servlet:
      content-type: text/html
    cache: false
    prefix: classpath:/templates/
    suffix: .html

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.feeltens.git.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.feeltens.git: DEBUG
    root: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'

merge-flow:
  # git服务提供方：gitlab、codeup
  gitService: gitlab
  # gitService: codeup

  # 工作目录配置
  work-dir: /tmp/git-merge-flow/workspace

  # 定时任务配置
  schedule:
    # 拉取远程分支信息（现有）
    pull-remote-branch: "0 */15 * * * *"
    # 同步主分支代码（新增）
    sync-main-branch: "0 */30 * * * *"
    # 清理过期会话（现有）
    cleanup-expired-sessions: "0 0 * * * *"
    # 缓存统计报告（现有）
    report-cache-statistics: "0 */30 * * * *"
    # 克隆未克隆的项目（新增）
    clone-pending-projects: "0 */5 * * * *"

  # 仓库缓存配置
  repo-cache:
    # 是否启用仓库缓存
    enabled: true
    # 缓存根目录（动态计算：${workDir}/repo-cache）
    # cache-path: ${merge-flow.work-dir}/repo-cache
    # 最大缓存大小（GB）
    max-cache-size-gb: 100
    # 克隆超时时间（秒）
    clone-timeout-seconds: 600
    # 拉取超时时间（秒）
    pull-timeout-seconds: 300
    # 最大重试次数
    max-retry-count: 3
    # 重试间隔（秒）
    retry-interval-seconds: 60

# GitLab API 配置
gitlab:
  api:
    # gitlab api 基础url
    # baseUrl: http://192.168.111.221
    baseUrl: set-your-gitlab-base-url
    # gitlab api 访问令牌
    # http://192.168.111.221/-/user_settings/personal_access_tokens
    accessToken: set-your-gitlab-access-token

# CodeUp API 配置
codeup:
  api:
    # codeup api 基础url
    baseUrl: https://openapi-rdc.aliyuncs.com
    # codeup api 访问令牌
    # https://account-devops.aliyun.com/settings/personalAccessToken
    accessToken: set-your-codeup-access-token

# JGit 冲突解决配置
jgit:
  conflict:
    # 临时仓库根目录（动态计算：${workDir}/conflict-cache）
    # temp-repo-path: ${merge-flow.work-dir}/conflict-cache
    # 会话过期时间（小时）
    session-expire-hours: 24
    # 克隆超时时间（秒）
    clone-timeout-seconds: 300
    # 最大并发会话数（每个工程）
    max-sessions-per-project: 10
    # 单个冲突文件最大大小（字节），默认 10MB
    max-conflict-file-size: 10485760
    # 是否启用稀疏检出优化（API预检+浅克隆+按需检出）
    # 启用后，对于大型仓库可显著提升克隆速度（6-30倍）
    # 默认启用，如遇问题可设置为false降级到完整克隆
    enable-sparse-checkout: true

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 86400
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-print: false
